<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asa Gloria's Lounge</title>
<meta name="description" content="Asa Gloria's Lounge: no-limit Texas Hold'em with friends. Pick a name, share a link, deal.">
<meta name="theme-color" content="#1a0b30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='6' fill='%23fbf8f0'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23c3342b'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a purple card room at night, a bright green stadium table with a gold trim and black rail, the dealer standing behind it. */
  --room-top: #3a1768;
  --room: #1a0b30;
  --room-deep: #0e0619;
  --panel: #241341;
  --line: #3f2a68;
  --ink: #ffffff;
  --muted: #c4b6e4;
  --gold: #f4c94c;
  --gold-ink: #2b1d00;
  --felt: #22a447;
  --felt-deep: #127d31;
  --rail: #151515;
  --purple: #6a46d4;
  --purple-deep: #43249e;
  --green: #4ade80;
  --red: #e2463b;
  --card: #ffffff;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-card: "Roboto Slab", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(120% 70% at 50% 0%, var(--room-top) 0%, var(--room) 55%, var(--room-deep) 100%) fixed; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2 { margin: 0; font-weight: 900; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

/* room decoration */
.room-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.room-deco .suit { position: absolute; font-size: 34vh; line-height: 1; color: transparent; -webkit-text-stroke: 3px rgba(255, 168, 96, .16); filter: drop-shadow(0 0 12px rgba(255, 140, 80, .18)); }
.room-deco .s1 { left: -4vh; top: -2vh; }
.room-deco .s2 { right: -4vh; top: -2vh; }
.room-deco .lights { position: absolute; left: 10%; right: 10%; top: 3vh; height: 10px; background: radial-gradient(circle, rgba(255,236,200,.95) 0 2px, rgba(255,220,160,.25) 3px, transparent 6px) 0 0 / 70px 10px repeat-x; opacity: .7; }

/* buttons */
.btn { border: 1px solid rgba(255,255,255,.14); background: #2e1b52; padding: 10px 16px; border-radius: 12px; font-weight: 800; transition: filter .15s, transform .05s; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: linear-gradient(#ffd96a, #e9b331); color: var(--gold-ink); border-color: #ffe596; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.ghost { background: transparent; }
.pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 150px; height: 58px; padding: 0 22px; border-radius: 14px; border: 2px solid #8a6cf0; background: linear-gradient(180deg, #7b56e6 0%, var(--purple) 45%, var(--purple-deep) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.45); color: #fff; font-weight: 900; font-size: 19px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.pbtn:hover { filter: brightness(1.1); }
.pbtn:active { transform: translateY(1px); }
.pbtn.fold { border-color: #f07a6e; background: linear-gradient(180deg, #e8655a, #c43a30 50%, #8f241c); }
.pbtn.go { border-color: #ffe596; background: linear-gradient(180deg, #ffd96a, #e9b331 55%, #b9851a); color: var(--gold-ink); text-shadow: none; }
.pbtn .dot { width: 22px; height: 22px; border-radius: 50%; background: #241046; box-shadow: inset 0 2px 3px rgba(0,0,0,.6); flex: none; }
.pbtn.armed .dot { background: radial-gradient(circle, var(--green) 0 45%, #241046 50%); }
.pbtn.armed { border-color: var(--green); }
.pbtn small { font-size: 13px; opacity: .9; font-weight: 800; }
.iconbtn { width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: rgba(30, 16, 56, .85); display: grid; place-items: center; position: relative; font-size: 22px; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.iconbtn svg { width: 24px; height: 24px; fill: none; stroke: #e9e2ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge-n { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); font-size: 12px; font-weight: 900; display: grid; place-items: center; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.input { background: #150a29; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; }
.input:focus { border-color: var(--gold); outline: none; }

/* loading */
.center-screen { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
.center-screen .box { max-width: 440px; display: grid; gap: 14px; justify-items: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* lobby */
.lobby { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 32px 18px 60px; display: grid; gap: 24px; }
.brand { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.brand img { width: 120px; height: 120px; object-fit: cover; object-position: 50% 4%; border-radius: 50%; border: 4px solid var(--gold); box-shadow: 0 0 0 6px rgba(244,201,76,.15), 0 10px 30px rgba(0,0,0,.5); background: #2a1650; }
.brand h1 { font-size: clamp(40px, 7vw, 66px); line-height: 1; letter-spacing: -.01em; }
.brand h1 span { color: var(--gold); }
.brand p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; font-size: 16px; }
.lobby-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
.panel { background: rgba(36, 19, 65, .92); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; align-content: start; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.panel h2 { font-size: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.code-input { letter-spacing: .3em; text-transform: uppercase; font-size: 22px; text-align: center; font-weight: 900; }
.tables-list { display: grid; gap: 8px; }
.trow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #180c2e; border: 1px solid var(--line); }
.trow .tname { font-weight: 800; }
.trow .tmeta { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #2c1b4d; color: var(--muted); }
.pill.live { background: #123d24; color: #8ff0b0; }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.note { font-size: 13px; color: var(--muted); background: #180c2e; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }

/* ---------- table screen ---------- */
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.hud { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }
.hud .info { margin-left: auto; text-align: right; line-height: 1.2; }
.hud .info b { display: block; font-size: 16px; }
.hud .info span { font-size: 13px; color: var(--muted); }
.codechip { font-weight: 900; letter-spacing: .16em; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.stage { display: grid; place-items: center; padding: 4px 10px; min-height: 0; }
.table-wrap { position: relative; width: min(100%, calc((100dvh - 150px) * 1.7)); aspect-ratio: 1.7; container-type: inline-size; }
.dealer-img { position: absolute; left: 50%; bottom: 70%; width: 14cqw; transform: translateX(-50%); z-index: 1; pointer-events: none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
.rail { position: absolute; inset: 27% 4.5% 4% 4.5%; border-radius: 999px; z-index: 2; background: linear-gradient(180deg, #3a3a3a 0%, var(--rail) 18%, #0a0a0a 100%); box-shadow: 0 0 0 .35cqw #c99a3b, 0 0 0 1.4cqw rgba(88, 40, 150, .55), 0 2cqw 5cqw rgba(0,0,0,.65); }
.felt { position: absolute; inset: 31.5% 9% 9.5% 9%; border-radius: 999px; z-index: 3; background: radial-gradient(ellipse at 50% 38%, #3ccb62 0%, var(--felt) 50%, var(--felt-deep) 100%); box-shadow: 0 0 0 .45cqw #f0c45a, 0 0 0 .8cqw #8b6420, inset 0 0 4cqw rgba(0,0,0,.35); }

#felt { position: absolute; inset: 0; z-index: 4; }

/* centre */
.statusline { position: absolute; left: 50%; top: 39.5%; transform: translate(-50%, -50%); width: 46cqw; z-index: 6; pointer-events: none; }
.center { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 1.1cqw; width: 64cqw; }
.pot { display: inline-flex; align-items: center; gap: .8cqw; background: rgba(0,0,0,.45); border-radius: 999px; padding: .35cqw 1.4cqw .35cqw .4cqw; font-weight: 900; font-size: max(13px, 1.7cqw); }
.chip { width: max(18px, 2.3cqw); height: max(18px, 2.3cqw); border-radius: 50%; flex: none; background: radial-gradient(circle, #fff 0 28%, #2f7de1 30% 52%, #fff 54% 62%, #2f7de1 64%); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.board { display: flex; gap: .8cqw; }
.status { font-weight: 800; font-size: max(13px, 1.6cqw); text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.6); min-height: 1.4em; }
.status b { color: var(--gold); }

/* cards */
.card { --w: 7.6cqw; width: var(--w); height: calc(var(--w) * 1.38); border-radius: calc(var(--w) * .09); background: var(--card); color: #111; position: relative; flex: none; box-shadow: 0 .3cqw .9cqw rgba(0,0,0,.45); font-family: var(--font-card); overflow: hidden; }
.card.red { color: #d0211b; }
.card .cr { position: absolute; left: 9%; top: 3%; font-size: calc(var(--w) * .42); font-weight: 700; line-height: 1; letter-spacing: -.04em; }
.card .cs { position: absolute; left: 11%; top: 34%; font-size: calc(var(--w) * .3); line-height: 1; font-family: var(--font-body); }
.card .cbig { position: absolute; right: 6%; bottom: 3%; font-size: calc(var(--w) * .62); line-height: 1; font-family: var(--font-body); }
.card.back { background: #5960d8 repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); border: calc(var(--w) * .07) solid #fff; }
.card.slot { background: rgba(0,0,0,.08); border: 2px dashed rgba(255,255,255,.22); box-shadow: none; }
.card.win { box-shadow: 0 0 0 .35cqw var(--gold), 0 0 2cqw rgba(244,201,76,.7); transform: translateY(-.6cqw); }
.card.mine { box-shadow: 0 0 0 .3cqw var(--green), 0 .3cqw .9cqw rgba(0,0,0,.45); }
.card.dim { filter: brightness(.55) saturate(.5); }
/* ---- card motion ---- */
.board { --step: 8.4cqw; --dy: -18.8cqw; }
.card.anim-flop, .card.anim-turn, .card.anim-mine { --flipdur: 1250ms; }
.card.anim-flop { animation: flopIn 1250ms cubic-bezier(.25,.7,.25,1) both; }
@keyframes flopIn {
  0% { opacity: 0; transform: translate(calc(var(--step) * 2), var(--dy)) translateX(calc(var(--k) * var(--step) * -1)) scale(.55) rotate(-14deg); }
  6% { opacity: 1; }
  34%, 40% { transform: translateX(calc(var(--k) * var(--step) * -1)); }
  68% { transform: none; }
  84% { transform: scaleX(0); }
}
.card.anim-turn { --flipdur: 950ms; animation: cardFly 950ms cubic-bezier(.25,.7,.25,1) both; }
@keyframes cardFly {
  0% { opacity: 0; transform: translate(calc((2 - var(--k)) * var(--step)), var(--dy)) scale(.55) rotate(-16deg); }
  8% { opacity: 1; }
  62% { transform: none; }
  84% { transform: scaleX(0); }
}
/* a face-down cover that drops away at the moment the card turns over */
.card.anim-flop::after, .card.anim-turn::after, .card.anim-mine::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #5960d8 repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); border: calc(var(--w) * .07) solid #fff; opacity: 0; animation: coverOff var(--flipdur) linear both; animation-delay: inherit; }
@keyframes coverOff { 0%, 83.9% { opacity: 1; } 84%, 100% { opacity: 0; } }
.card.anim-deal { animation: dealIn 420ms cubic-bezier(.2,.75,.3,1) both; }
@keyframes dealIn {
  0% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.5) rotate(-30deg); }
  12% { opacity: 1; }
}
.card.anim-mine { --flipdur: 950ms; animation: dealMine 950ms cubic-bezier(.2,.75,.3,1) both; }
@keyframes dealMine {
  0% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.4) rotate(-30deg); }
  8% { opacity: 1; }
  55% { transform: var(--rest); }
  70% { transform: var(--rest) scale(1.06); }
  84% { transform: var(--rest) scaleX(0); }
}
.toss { position: absolute; z-index: 7; display: flex; pointer-events: none; transform: translate(-50%, -50%); animation: toss 750ms cubic-bezier(.3,.55,.4,1) both; }
.toss .card { --w: 4.4cqw; }
.toss .card + .card { margin-left: -2cqw; transform: rotate(14deg); }
@keyframes toss {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(0) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(340deg) scale(.6); }
}
.card.sm { --w: 3cqw; border-radius: 4px; }
.card.lg { --w: 5.6cqw; }

/* seats */
.seat { position: absolute; transform: translate(-50%, -50%); width: 8cqw; display: grid; justify-items: center; z-index: 5; }
.av { --av: 7.6cqw; width: var(--av); height: var(--av); border-radius: 50%; position: relative; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, white), var(--c) 55%, color-mix(in srgb, var(--c) 60%, black)); border: .35cqw solid #1d1d1d; box-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.55); font-weight: 900; font-size: calc(var(--av) * .42); color: rgba(20, 10, 30, .85); }
.av::before { content: ""; position: absolute; inset: -.55cqw; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--t, 1) * 1turn), rgba(255,255,255,.08) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - .5cqw), #000 calc(100% - .45cqw)); mask: radial-gradient(farthest-side, transparent calc(100% - .5cqw), #000 calc(100% - .45cqw)); opacity: 0; }
.seat.turn .av::before { opacity: 1; }
.seat.turn.low .av::before { background: conic-gradient(var(--red) calc(var(--t, 1) * 1turn), rgba(255,255,255,.08) 0); }
.seat.turn .av { border-color: var(--green); }
.seat.folded .av, .seat.away .av { filter: grayscale(.85) brightness(.6); }
.seat.winner .av { border-color: var(--gold); box-shadow: 0 0 0 .4cqw rgba(244,201,76,.5), 0 0 3cqw rgba(244,201,76,.6); }
.tag { display: flex; align-items: stretch; margin-top: -.6cqw; position: relative; z-index: 2; box-shadow: 0 .3cqw .8cqw rgba(0,0,0,.5); border-radius: .5cqw; overflow: hidden; white-space: nowrap; font-size: max(10px, 1.25cqw); }
.tag .nm { background: rgba(10, 6, 18, .85); padding: .3cqw .7cqw; max-width: 11cqw; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
.tag .ch { background: linear-gradient(#ffe27a, #f2bf3a); color: var(--gold-ink); padding: .3cqw .7cqw; font-weight: 900; }
.mini { position: absolute; left: 60%; top: 20%; display: flex; z-index: 3; }
.mini .card { margin-left: -1.3cqw; transform: rotate(8deg); }
.mini .card:first-child { margin-left: 0; transform: rotate(-4deg); }
.mini.shown .card { margin-left: -.6cqw; transform: none; }
.mini.shown { left: 66%; top: 32%; }
.mini.shown.inside-left { left: auto; right: 66%; }
.mini.shown .card { --w: 3.4cqw; }
.card.flipup { animation: flipUp .5s ease both; }
.card.flipup::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #5960d8 repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); opacity: 0; animation: coverOff .5s linear both; }
@keyframes flipUp { 0% { transform: scaleX(1); } 84% { transform: scaleX(0); } 100% { transform: none; } }
.bubble { position: absolute; bottom: calc(100% - 1.5cqw); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: max(10px, 1.2cqw); font-weight: 900; padding: .2cqw .8cqw; border-radius: 999px; background: rgba(10, 6, 18, .8); color: #fff; z-index: 4; }
.bubble.fold { color: #ffb4ad; }
.bubble.raise { background: #7a3cff; }
.bubble.allin { background: var(--red); }
.bubble.win { background: linear-gradient(#ffe27a, #f2bf3a); color: var(--gold-ink); }
.bubble.hand { background: rgba(10,6,18,.85); color: var(--gold); }
.betchip { position: absolute; transform: translate(-50%, -50%); z-index: 5; display: inline-flex; align-items: center; gap: .5cqw; font-weight: 900; font-size: max(11px, 1.3cqw); background: rgba(0,0,0,.45); border-radius: 999px; padding: .2cqw .9cqw .2cqw .25cqw; }
.betchip .chip { width: max(14px, 1.8cqw); height: max(14px, 1.8cqw); background: radial-gradient(circle, #fff 0 28%, #d33 30% 52%, #fff 54% 62%, #d33 64%); }
.dbtn { position: absolute; transform: translate(-50%, -50%); z-index: 5; width: max(18px, 2.4cqw); height: max(18px, 2.4cqw); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #cfcfcf); color: #222; font-weight: 900; font-size: max(10px, 1.3cqw); display: grid; place-items: center; box-shadow: 0 .2cqw .6cqw rgba(0,0,0,.6); }
.sitbtn { border: 2px dashed rgba(255,255,255,.35); background: rgba(10,6,18,.5); color: #fff; border-radius: 999px; padding: .7cqw 1.4cqw; font-size: max(11px, 1.3cqw); font-weight: 900; white-space: nowrap; }
.sitbtn:hover { border-color: var(--gold); }
.emptyseat { width: 5cqw; height: 5cqw; border-radius: 50%; border: 2px dashed rgba(255,255,255,.18); }

/* my hand at my seat */
.myhand { position: absolute; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: .6cqw; transform: translateY(-50%); }
.mylabel { display: grid; justify-items: center; gap: .35cqw; font-weight: 900; color: var(--gold); background: rgba(10, 6, 18, .85); border: 1px solid rgba(244,201,76,.45); border-radius: 1.4cqw; padding: .3cqw 1.2cqw .55cqw; font-size: max(12px, 1.45cqw); white-space: nowrap; box-shadow: 0 .3cqw .8cqw rgba(0,0,0,.45); }
/* hand strength "health bar" */
.hbar { position: relative; width: max(70px, 9cqw); height: max(9px, 1cqw); border-radius: 999px; background: #2a0f12; border: 1px solid rgba(255,255,255,.25); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
.hbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; transition: width .6s cubic-bezier(.3,.8,.3,1), background .4s; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%), var(--hb); box-shadow: 0 0 8px var(--hb); }
.hbar.low { --hb: #e2463b; } .hbar.mid { --hb: #f2b134; } .hbar.high { --hb: #3ccf6a; }
.hbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(10,6,18,.75) calc(10% - 1px) 10%); pointer-events: none; }
.mylabel.folded { color: var(--muted); border-color: rgba(255,255,255,.15); }
.seat.bust .av { filter: grayscale(1) brightness(.45); border-color: #333; box-shadow: none; }
.seat.bust .tag { opacity: .55; }
.myhand .cards { display: flex; }
.myhand .cards .card { transform: var(--rest); }
.myhand .cards .card:first-child { --rest: rotate(-4deg); }
.myhand .cards .card + .card { margin-left: -2.3cqw; --rest: rotate(6deg) translateY(.4cqw); }
.hl { display: grid; gap: 3px; min-width: 150px; align-content: center; }

.lobby { position: relative; }

/* these are labels inside a form field, so undo the small uppercase heading style */
.field label.mode, .field label.stakeopt { display: block; cursor: pointer; text-transform: none; letter-spacing: normal; color: var(--ink); font-size: inherit; font-weight: inherit; }

.mode span, .stakeopt span { display: grid; place-items: center; gap: 2px; height: 100%; border-radius: 14px; border: 2px solid var(--line); background: #150a29; transition: border-color .2s, background .2s, transform .12s; text-align: center; }

/* ---- interface motion ---- */
.btn, .pbtn, .iconbtn, .sitbtn { position: relative; overflow: hidden; transition: transform .14s ease, box-shadow .2s ease, filter .2s ease, border-color .2s ease; }
.iconbtn { overflow: visible; }
.btn:hover, .iconbtn:hover, .sitbtn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.pbtn:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(0,0,0,.5), 0 0 22px rgba(138,108,240,.55); }
.pbtn.fold:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(0,0,0,.5), 0 0 22px rgba(240,122,110,.55); }
.pbtn.go:hover, .btn.gold:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 24px rgba(0,0,0,.5), 0 0 22px rgba(255,214,90,.6); }
.btn:active, .pbtn:active, .iconbtn:active, .sitbtn:active { transform: translateY(1px) scale(.95); transition-duration: .05s; }
.pbtn::before, .btn.gold::before { content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent); transform: skewX(-20deg); pointer-events: none; }
.pbtn:hover::before { animation: shine .7s ease; }
.pbtn.go::before, .btn.gold::before { animation: shineLoop 3.4s ease-in-out infinite; }
@keyframes shine { from { left: -70%; } to { left: 130%; } }
@keyframes shineLoop { 0% { left: -70%; } 35%, 100% { left: 130%; } }
.ripple { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(255,255,255,.45); pointer-events: none; animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.bar .right.enter > * { animation: btnUp .42s cubic-bezier(.2,.8,.3,1.35) both; }
.bar .right.enter > *:nth-child(2) { animation-delay: .06s; }
.bar .right.enter > *:nth-child(3) { animation-delay: .12s; }
.bar .right.enter > *:nth-child(4) { animation-delay: .18s; }
@keyframes btnUp { from { opacity: 0; transform: translateY(26px) scale(.88); } }
.pbtn.armed .dot { animation: pop .32s cubic-bezier(.3,1.7,.5,1); }
@keyframes pop { from { transform: scale(.2); } }
.raisepanel.enter { animation: panelUp .24s cubic-bezier(.2,.8,.3,1.2) both; transform-origin: 85% 100%; }
@keyframes panelUp { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.bar .hl.enter { animation: fadeUp .35s ease both; }
.ladder i.cur { animation: ladderGlow 1.6s ease-in-out infinite alternate; }
@keyframes ladderGlow { to { box-shadow: 0 0 10px rgba(255,224,122,1); } }
/* table */
.seat.enter { animation: seatIn .45s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes seatIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.3); } }
.bubble.pop { animation: bubblePop .38s cubic-bezier(.3,1.7,.5,1) both; }
@keyframes bubblePop { from { opacity: 0; transform: translateX(-50%) translateY(.8cqw) scale(.4); } }
.betchip.slide { animation: chipIn .45s cubic-bezier(.25,.7,.3,1) both; }
@keyframes chipIn { from { opacity: .2; transform: translate(calc(-50% + var(--fx)), calc(-50% + var(--fy))) scale(.6); } }
.pot.bump { animation: bump .5s ease both; }
@keyframes bump { 40% { transform: scale(1.18); box-shadow: 0 0 2.4cqw rgba(244,201,76,.7); } }
.flychip { position: absolute; z-index: 8; pointer-events: none; transform: translate(-50%, -50%); animation: flyChip .8s cubic-bezier(.35,.6,.3,1) both; }
@keyframes flyChip { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); } }
.dbtn.enter { animation: dIn .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes dIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-180deg); } }
.seat.turn .av { animation: turnPulse 1.4s ease-in-out infinite; }
@keyframes turnPulse { 50% { box-shadow: 0 0 0 .7cqw rgba(74,222,128,.22), 0 .5cqw 1.4cqw rgba(0,0,0,.55); } }
.seat.turn.low .av { animation: lowPulse .55s ease-in-out infinite; }
@keyframes lowPulse { 50% { box-shadow: 0 0 0 .8cqw rgba(226,70,59,.35); transform: scale(1.04); } }
.seat.winner .av { animation: winGlow 1s ease-in-out infinite alternate; }
@keyframes winGlow { to { box-shadow: 0 0 0 .6cqw rgba(244,201,76,.6), 0 0 4cqw rgba(244,201,76,.9); } }
.status b.yt { animation: ytGlow 1.1s ease-in-out infinite alternate; display: inline-block; }
@keyframes ytGlow { to { text-shadow: 0 0 12px rgba(244,201,76,.95), 0 1px 3px rgba(0,0,0,.6); transform: scale(1.06); } }
.status.enter { animation: fadeUp .4s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
@keyframes fadeIn { from { opacity: 0; } }
/* all-in: chip stacks around the avatar and a ring of fire circling it */
.seat.allin .av { border-color: #ff9a2e; box-shadow: 0 0 0 .3cqw rgba(255,140,40,.6), 0 0 3.5cqw rgba(255,110,20,.85); }
.fire { position: absolute; inset: calc(var(--av) * -0.6); z-index: -1; pointer-events: none; animation: spin 2.6s linear infinite; }
.fire::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle, rgba(255,150,40,.7) 40%, rgba(255,80,0,0) 70%); animation: firePulse .9s ease-in-out infinite alternate; }
.fl { position: absolute; left: 50%; top: 50%; width: calc(var(--av) * .46); height: calc(var(--av) * .8); margin: calc(var(--av) * -.4) 0 0 calc(var(--av) * -.23); transform: rotate(var(--a)) translateY(calc(var(--av) * -.68)); }
.fl i { display: block; width: 100%; height: 100%; border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%; background: radial-gradient(ellipse at 50% 78%, #fffbd0 0 14%, #ffd84a 28%, #ff8a1e 52%, rgba(255,50,0,0) 72%); transform-origin: 50% 85%; animation: flicker .42s ease-in-out infinite alternate; animation-delay: var(--d); filter: blur(.4px); mix-blend-mode: screen; }
@keyframes flicker { 0% { transform: scale(.82, .78) skewX(-6deg); opacity: .8; } 100% { transform: scale(1.08, 1.22) skewX(6deg); opacity: 1; } }
@keyframes firePulse { to { transform: scale(1.12); opacity: .75; } }
@keyframes spin { to { transform: rotate(360deg); } }
.seat.allin.burst .fire { animation: spin 2.6s linear infinite, fireBurst .7s ease-out both; }
@keyframes fireBurst { 0% { opacity: 0; scale: .3; } 40% { opacity: 1; scale: 1.5; } 100% { scale: 1; } }
.cstacks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.seat.allin.away .av { filter: none; }
.cstack { position: absolute; left: 50%; top: 50%; width: calc(var(--av) * .38); height: calc(var(--av) * .42); margin: calc(var(--av) * -.21) 0 0 calc(var(--av) * -.19); transform: rotate(var(--a)) translateY(calc(var(--av) * -.66)) rotate(calc(var(--a) * -1)); }
.cstack i { position: absolute; left: 0; right: 0; height: 34%; border-radius: 50%; background: radial-gradient(ellipse, #fff 0 22%, var(--cc) 24% 56%, #fff 58% 64%, var(--cc) 66%); box-shadow: 0 1px 0 rgba(0,0,0,.55), 0 2px 3px rgba(0,0,0,.35); }
.cstack i:nth-child(1) { bottom: 0; } .cstack i:nth-child(2) { bottom: 18%; } .cstack i:nth-child(3) { bottom: 36%; } .cstack i:nth-child(4) { bottom: 54%; } .cstack i:nth-child(5) { bottom: 72%; }
.seat.allin.burst .cstack { animation: stackIn .5s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d); }
@keyframes stackIn { from { opacity: 0; scale: .2; } }
/* drawer, overlays, toasts, lobby */
.scrim { animation: fadeIn .2s ease both; }
.pane.enter { animation: fadeUp .25s ease both; }
.chatmsg.new { animation: msgIn .35s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes msgIn { from { opacity: 0; transform: translateX(-14px); } }
.overlay { animation: fadeIn .2s ease both; }
.overlay .panel { animation: popIn .35s cubic-bezier(.3,1.4,.5,1) both; }

  if (i < 0 || !t.myHole || !t.seats[i].inHand) return null;
  return E.describe(t.myHole, t.board);
}
function turnKey(t) {
  const i = mySeatIdx(t);

}
function potTotal(t) { return t.seats.reduce((a, s) => a + (s && s.inHand ? s.committed || 0 : 0), 0); }

/* ------------------------------------------------------------------ the table itself */
function spotsFor(t) {
  const set = tallMQ.matches ? SPOTS.tall : SPOTS.wide;
  const spots = set[t.seats.length] || set[8];
  // sideways phone: name tags can't shrink below a readable size, so the bottom corners sit a little further out
  if (phoneLandMQ.matches && spots.length === 8) return spots.map((p, k) => (k === 1 ? [20, 87] : k === 7 ? [80, 87] : p));
  return spots;
}
function seatPos(t, i) {
  const n = t.seats.length;
  const mine = mySeatIdx(t);
  const k = (i - (mine >= 0 ? mine : 0) + n) % n;
  const [x, y] = spotsFor(t)[k];
  const tall = tallMQ.matches;
  const toward = (f) => [x + (50 - x) * f, y + (52 - y) * f];
  let [bx, by] = toward(tall ? 0.36 : 0.4);
  // the dealer button sits beside the player, toward the middle of the table, clear of their bet
  const side = x < 50 ? 1 : -1, off = tall ? (y < 25 ? 18 : 12) : (y < 35 ? 14 : 8); // top-row seats: further out, clear of revealed cards
  let dx = x + side * off, dy = y + (52 - y) * 0.15;
  if (!tall && y > 80 && (k === 1 || k === n - 1)) {
    // bottom corners: bet goes up beside them, clear of your cards (on a sideways phone, straight above them)
    if (phoneLandMQ.matches) { bx = x; by = y - 16.5; } else { bx = x + (50 - x) * 0.14; by = y - 15; }
  }
  if (k === 0) {
    // your own seat: your bet goes up-left of you and the button sits on your left, so your cards cover neither
    [bx, by] = tall ? [33, 78] : [40.5, 76.5];
    [dx, dy] = tall ? [36, 89] : [40, 87];
  }
  return { x, y, bx, by, dx, dy, k };
}
function actClass(a) {
  const s = String(a || "").toLowerCase();
  if (s.startsWith("fold")) return "fold";
  if (s.startsWith("all-in")) return "allin";
  if (s.startsWith("raise") || s.startsWith("bet")) return "raise";
  return "";
}
/* ------------------------------------------------------------------ card motion */
const SHOWDOWN_PAUSE = 2500;
const DEAL_GAP = 120, DEAL_DUR = 420, MINE_DUR = 950, FLOP_DUR = 1250, TURN_DUR = 950, TOSS_DUR = 750;
const tableH = () => (tallMQ.matches ? 156.25 : 58.82);    // table height in cqw (width / aspect ratio)
const dealerY = () => (tallMQ.matches ? 18 : 29);          // where the dealer's hands are, in % of table height
// Returns an animation-delay that keeps an animation in step with when it really started,
// so re-drawing the table mid-animation doesn't restart it. null once it has finished.
function animDelay(t0, delay, dur) {
  const el = Date.now() - t0;
  return el > delay + dur ? null : Math.round(delay - el);
}
function dealLength(d) { return d ? d.order.length * 2 * DEAL_GAP + MINE_DUR : 0; }
function noteMotion(prev, t) {
  if (!prev || prev.code !== t.code) return; // nothing to animate on first load
  const now = Date.now();
  if (t.handNo !== prev.handNo && t.handNo > 0) {
    const n = t.seats.length, order = [];
    for (let k = 1; k <= n; k++) { const i = (t.dealer + k) % n; if (t.seats[i] && t.seats[i].inHand) order.push(i); }
    S.fx = Object.assign(newFx(), { deal: { hand: t.handNo, t0: now, order }, raiseAt: S.fx.raiseAt });
    if (order.length) playSfx("deal");
  }
  const same = prev.handNo === t.handNo;
  t.seats.forEach((s, i) => {
    const p = prev.seats[i];
    if (!s) return;
    if (!p || p.uid !== s.uid) { S.fx.seatIn[i] = now; return; }
    if (s.lastAct && s.lastAct !== p.lastAct) S.fx.bubble[i] = now;
    if (isActive(t) && s.bet > (same ? p.bet || 0 : 0)) S.fx.bet[i] = now;
    if (s.allIn && s.inHand && !(same && p.allIn)) S.fx.allin[i] = now;
  });
  if (isActive(t) && potTotal(t) > (same ? potTotal(prev) : 0)) S.fx.pot = now;
  // one sound per action, including the call that ends a betting round
  const la = t.lastAction, pla = prev.lastAction;
  if (la && (!pla || la.n !== pla.n)) { const snd = soundForAction(la.label); if (snd) playSfx(snd); }
  if (t.dealer !== prev.dealer) S.fx.dealerAt = now;
  const mi = mySeatIdx(t);
  if (mi >= 0 && isActive(t) && t.toAct === mi && !(same && prev.phase === t.phase && prev.toAct === mi)) { S.fx.turn = now; playSfx("yourturn", 250); }
  const had = prev.handNo === t.handNo ? prev.board.length : 0;
  const has = t.board.length;
  if (has > had) {
    let t0 = now;
    const d = S.fx.deal;
    if (d && d.hand === t.handNo) t0 = Math.max(t0, d.t0 + dealLength(d));
    const last = S.fx.board.filter((b) => b.hand === t.handNo).pop();
    if (last) t0 = Math.max(t0, last.t0 + (last.type === "flop" ? FLOP_DUR : TURN_DUR) + 150);
    if (had < 3 && has >= 3) { S.fx.board.push({ hand: t.handNo, type: "flop", t0 }); playSfx("flop", t0 - now); t0 += FLOP_DUR + 250; }
    if (had < 4 && has >= 4) { S.fx.board.push({ hand: t.handNo, type: "turn", k: 3, t0 }); playSfx("turn", t0 - now); t0 += TURN_DUR + 200; }
    if (had < 5 && has >= 5) { S.fx.board.push({ hand: t.handNo, type: "turn", k: 4, t0 }); playSfx("river", t0 - now); }
  }
  if (prev.handNo === t.handNo) {
    t.seats.forEach((s, i) => {
      const p = prev.seats[i];
      if (s && p && s.uid === p.uid && s.inHand && s.folded && !p.folded) S.fx.folds[i] = now;
      if (s && p && s.uid === p.uid && s.showedOff && !p.showedOff) { S.fx.showAt = S.fx.showAt || {}; S.fx.showAt[i] = now; playSfx("turn"); }
    });
  }
  if (t.phase === "done" && t.result && !t.result.voided && t.result.winners && (prev.phase !== "done" || prev.handNo !== t.handNo)) {
    let t0 = now + 250;
    const last = S.fx.board.filter((b) => b.hand === t.handNo).pop();
    if (last) t0 = Math.max(t0, last.t0 + (last.type === "flop" ? FLOP_DUR : TURN_DUR) + 300);
    if (t.result.showdown) t0 += SHOWDOWN_PAUSE; // let everyone see the cards before the chips move
    S.fx.win = { hand: t.handNo, t0, winners: t.result.winners.map((w) => w.seat) };
    // chips going to each winner, timed with the chips flying from the pot
    S.fx.win.winners.forEach((_, n) => playSfx("win", t0 - now + n * 250 + 150));
  }
}
// While the board is still being dealt out on screen, keep the result and the final hand hidden.
function holding(t) {
  const w = S.fx.win;
  return !!(t && t.phase === "done" && w && w.hand === t.handNo && Date.now() < w.t0);
}
function shownBoard(t) {
  let len = t.board.length;
  const now = Date.now();
  for (const b of S.fx.board) {
    if (b.hand !== t.handNo) continue;
    const end = b.t0 + (b.type === "flop" ? FLOP_DUR : TURN_DUR) * 0.84;
    if (now < end) len = Math.min(len, b.type === "flop" ? 0 : b.k);
  }
  return t.board.slice(0, len);
}
// redraw when the next on-screen reveal finishes
let revealT = null;
function scheduleReveal(t) {
  clearTimeout(revealT);
  const now = Date.now(), times = [];
  for (const b of S.fx.board) if (b.hand === t.handNo) times.push(b.t0 + (b.type === "flop" ? FLOP_DUR : TURN_DUR) * 0.84 + 30);
  if (S.fx.win && S.fx.win.hand === t.handNo) times.push(S.fx.win.t0 + 20);
  if (t.phase === "done" && t.doneAt) times.push(t.doneAt - S.clockSkew + 7100);
  const next = times.filter((x) => x > now).sort((x, y) => x - y)[0];
  if (next) revealT = setTimeout(() => { S.sideKey = ""; renderTable(); }, next - now);
}
// true while an event that happened at t0 is less than ms old
const fresh = (t0, ms) => t0 && Date.now() - t0 < ms;
const potY = () => (tallMQ.matches ? 43 : 46.5);
function fireHTML() {
  const flames = Array.from({ length: 10 }, (_, k) => `<span class="fl" style="--a:${k * 36}deg"><i style="--d:${(-k * 0.13).toFixed(2)}s"></i></span>`).join("");
  return `<div class="fire" aria-hidden="true">${flames}</div>`;
}
const STACK_COLORS = ["#d23a2e", "#2f7de1", "#1f9e4a", "#1b1b1b", "#e0a92a", "#8b3fd9", "#d23a2e", "#2f7de1"];
function stacksHTML() {

    const n = 3 + (k * 7) % 3;

// style + class for one hole card flying from the dealer to a seat
function dealMotion(t, i, round, x, y, mine) {
  const d = S.fx.deal;
  if (!d || d.hand !== t.handNo) return null;
  const idx = d.order.indexOf(i);
  if (idx < 0) return null;
  const dur = mine ? MINE_DUR : DEAL_DUR;
  const delay = animDelay(d.t0, (round * d.order.length + idx) * DEAL_GAP, dur);
  if (delay === null) return null;
  const fx = (50 - x).toFixed(2), fy = ((dealerY() - y) * tableH() / 100).toFixed(2);
  return { cls: mine ? "anim-mine" : "anim-deal", style: `--fx:${fx}cqw;--fy:${fy}cqw;animation-delay:${delay}ms;` };
}
function boardMotion(t, k) {
  for (const b of S.fx.board) {
    if (b.hand !== t.handNo) continue;
    if (b.type === "flop" && k < 3) {
      const delay = animDelay(b.t0, 0, FLOP_DUR);
      return delay === null ? null : { cls: "anim-flop", style: `--k:${k};animation-delay:${delay}ms;` };
    }
    if (b.type === "turn" && b.k === k) {
      const delay = animDelay(b.t0, 0, TURN_DUR);

    }

function cardWith(c, cls, m) {
  if (!m) return cardHTML(c, cls);

}

function renderFelt() {
  const t = S.table; if (!t) return;
  const mine = mySeatIdx(t);
  const hold = holding(t);
  const boardDone = shownBoard(t).length === t.board.length;
  const res = t.phase === "done" && !hold ? t.result : null;
  const wonBy = {};
  if (hold && t.result && t.result.winners) t.result.winners.forEach((w) => { wonBy[w.seat] = (wonBy[w.seat] || 0) + w.amount; });
  const winSeats = new Set(res && res.winners ? res.winners.map((w) => w.seat) : []);
  const winCards = new Set(res && res.winners ? res.winners.flatMap((w) => w.cards || []) : []);
  const mi0 = mySeatIdx(t);
  const mh = (isActive(t) || hold) && mi0 >= 0 && t.myHole && t.seats[mi0].inHand ? E.describe(t.myHole, shownBoard(t)) : null;
  const myCards = new Set(mh && mh.rank > 0 && t.board.length >= 3 ? mh.cards : []);
  const online = new Set(t.online || []);
  const html = [];
  t.seats.forEach((s, i) => {
    const p = seatPos(t, i);
    if (!s) {
      const canSit = mine < 0 && !(t.tour && t.tour.started);
      html.push(`<div class="seat" style="left:${p.x}%;top:${p.y}%">${canSit ? `<button class="sitbtn" data-sit="${i}">Sit here</button>` : `<span class="emptyseat" aria-hidden="true"></span>`}</div>`);
      return;
    }
    const isMe = i === mine;
    const turn = isActive(t) && t.toAct === i;
    let mini = "";
    if (s.inHand) {
      if (s.shown && t.phase === "done" && (res || hold) && !isMe) mini = `<div class="mini shown${p.x > 60 ? " inside-left" : ""}">${s.shown.map((c) => cardHTML(c, "sm " + (winCards.has(c) ? "win" : ""))).join("")}</div>`;
      else if (!isMe && !s.folded) mini = `<div class="mini">${[0, 1].map((r) => cardWith("back", "sm", dealMotion(t, i, r, p.x + 3, p.y - 2, false))).join("")}</div>`;
    }
    let bubble = "", bcls = actClass(s.lastAct);
    if (s.lastAct && isActive(t)) bubble = s.lastAct;
    if (s.leaving) { bubble = "Leaving"; bcls = ""; }
    else if (s.sitOut && !s.inHand) { bubble = "Sitting out"; bcls = ""; }
    else if (s.out && !(hold && s.inHand)) { bubble = s.place ? `Out · ${ordinal(s.place)}` : "Out"; bcls = ""; }
    else if (s.stack === 0 && !s.inHand) { bubble = (s.buyins || 1) >= (t.maxBuyins || 2) ? "No buy-ins left" : "Busted"; bcls = ""; }
    else if (!online.has(s.uid)) { bubble = "Offline"; bcls = ""; }
    if (res && winSeats.has(i)) { const w = res.winners.find((x) => x.seat === i); bubble = "Wins " + fmt(w.amount); bcls = "win"; }
    else if (res && res.hands && res.hands[i] && !isMe) { bubble = handLabel(res.hands[i]); bcls = "hand"; }
    else if (hold && boardDone && t.result && t.result.hands && t.result.hands[i] && !isMe) { bubble = handLabel(t.result.hands[i]); bcls = "hand"; }
    const away = !online.has(s.uid);
    const allin = s.allIn && s.inHand && !s.folded && (isActive(t) || hold);
    const bust = (s.out || (s.stack === 0 && !s.inHand)) && !(hold && s.inHand);
    if (s.showedOff && t.phase === "done" && !isMe) {
      const flip = S.fx.showAt && fresh(S.fx.showAt[i], 700);
      mini = `<div class="mini shown${p.x > 60 ? " inside-left" : ""}">${s.shown.map((c) => cardHTML(c, "sm" + (flip ? " flipup" : ""))).join("")}</div>`;
    }
    const cls = ["seat", isMe && "me", turn && "turn", s.folded && s.inHand && "folded", winSeats.has(i) && "winner", away && "away", bust && "bust",
      allin && "allin", allin && fresh(S.fx.allin[i], 900) && "burst", fresh(S.fx.seatIn[i], 450) && "enter"].filter(Boolean).join(" ");
    if (fresh(S.fx.bubble[i], 380)) bcls += " pop";
    html.push(`<div class="${cls}" style="left:${p.x}%;top:${p.y}%" data-seat="${i}">
      ${bubble ? `<div class="bubble ${bcls}">${esc(bubble)}</div>` : ""}
      <div class="av" style="--c:${hue(s.uid)}">${allin ? fireHTML() : ""}${esc((s.name || "?")[0].toUpperCase())}${allin ? stacksHTML() : ""}</div>
      ${mini}
      <div class="tag"><span class="nm">${esc(s.name)}</span><span class="ch num">${fmt(s.stack - (wonBy[i] || 0))}</span></div>
    </div>`);
    if (isMe && s.inHand && t.myHole) {
      const left = tallMQ.matches ? p.x + 9 : p.x + 6.5; // to the right of your avatar, clear of your SB/BB/Check label and chip count
      const top = tallMQ.matches ? p.y - 7 : p.y - 6.25;
      const d = E.describe(t.myHole, shownBoard(t));
      const label = s.folded ? "Folded" : handLabel(d.name);
      let bar = "";
      if (!s.folded && (isActive(t) || hold)) {
        // where the hand sits in the rankings: High Card = 1 ... Royal Flush = 10 (no odds, just the ladder)
        const level = d.name === "Royal flush" ? 10 : d.rank + 1;
        const lvl = level >= 6 ? "high" : level >= 3 ? "mid" : "low";
        bar = `<div class="hbar ${lvl}" role="meter" aria-valuemin="1" aria-valuemax="10" aria-valuenow="${level}" aria-label="Hand strength: ${esc(label)}, ${level} of 10" title="${esc(label)}: ${level} of 10 on the hand rankings"><i style="width:${level * 10}%"></i></div>`;
      }
      html.push(`<div class="myhand" style="left:${left}%;top:${top}%"><div class="cards">${t.myHole.map((c, r) => cardWith(c, "lg" + (s.folded ? " dim" : ""), dealMotion(t, i, r, left + 5 + r * 4, top, true))).join("")}</div>
        <div class="mylabel${s.folded ? " folded" : ""}">${esc(label)}${bar}</div></div>`);
    }
    const ft = S.fx.folds[i];
    if (ft && s.inHand && s.folded) {
      const delay = animDelay(ft, 0, TOSS_DUR);
      if (delay !== null) {
        const tx = ((50 - p.x) * 0.85).toFixed(2), ty = ((56 - p.y) * tableH() / 100 * 0.85).toFixed(2);
        const faces = isMe && t.myHole ? t.myHole : ["back", "back"];
        html.push(`<div class="toss" style="left:${p.x + (isMe ? 5 : 2)}%;top:${p.y - 3}%;--tx:${tx}cqw;--ty:${ty}cqw;animation-delay:${delay}ms">${faces.map((c) => cardHTML(c, "sm")).join("")}</div>`);
      }
    }
    if (s.inHand && s.bet > 0 && isActive(t)) {
      const sl = fresh(S.fx.bet[i], 450);
      const fx = (p.x - p.bx).toFixed(2), fy = ((p.y - p.by) * tableH() / 100).toFixed(2);
      html.push(`<div class="betchip${sl ? " slide" : ""}" style="left:${p.bx}%;top:${p.by}%;--fx:${fx}cqw;--fy:${fy}cqw"><span class="chip"></span>${fmt(s.bet)}</div>`);
    }
    if (i === t.dealer && t.handNo > 0) html.push(`<div class="dbtn${fresh(S.fx.dealerAt, 500) ? " enter" : ""}" style="left:${p.dx}%;top:${p.dy}%" title="Dealer button">D</div>`);
  });
  const board = [0, 1, 2, 3, 4].map((k) => {
    const c = t.board[k];
    const m = c ? boardMotion(t, k) : null;
    return cardWith(c, m ? "" : c && res && winCards.has(c) ? "win" : c && myCards.has(c) ? "mine" : "", m);
  }).join("");
  let status = "";
  const seated = t.seats.filter(Boolean).length;
  const isHost = t.hostUid === S.me;
  if (hold) {
    status = boardDone && t.result && t.result.showdown ? "<b>Showdown!</b>" : "Running it out…";
  } else if (t.phase === "waiting" || (!t.running && !isActive(t))) {
    if (t.tour && t.tour.finished) status = `<b>${esc(t.tour.finished.name)}</b> wins the tournament!`;
    else if (t.tour && !t.tour.started && seated >= 2 && !t.running) status = isHost ? "Everyone ready? Press <b>Start game</b>" : "Waiting for the host to start the tournament";
    else if (seated < 2) status = "Waiting for one more player. Tap <b>Invite</b> to get the link.";
    else if (!t.running) status = isHost ? "Everyone ready? Press <b>Start game</b>" : "Waiting for the host to start";
    else if (t.seats.filter((x) => x && !x.out && !x.leaving && !x.sitOut && x.stack > 0).length < 2) status = "Waiting for at least 2 players to sit in";
    else status = "Next hand coming up…";
  } else if (res && t.running && t.seats.filter((x) => x && !x.out && !x.leaving && !x.sitOut && x.stack > 0).length < 2 && Date.now() + S.clockSkew - (t.doneAt || 0) > 7000) {
    status = "Waiting for at least 2 players to sit in";
  } else if (res) {
    status = res.winners.map((w) => `<b>${esc(t.seats[w.seat] ? t.seats[w.seat].name : "Player")}</b> wins ${fmt(w.amount)}${w.hand ? " with " + esc(handLabel(w.hand)) : ""}`).join(" · ");
  } else if (isActive(t) && t.toAct >= 0) {
    status = t.toAct === mine ? `<b class="yt">Your turn</b>` : `${esc(t.seats[t.toAct].name)} is thinking…`;
  }
  const pot = potTotal(t);
  const w = S.fx.win;
  if (w && w.hand === t.handNo && t.phase === "done" && !hold) {
    w.winners.forEach((wi, n) => {
      const ws = t.seats[wi]; if (!ws) return;
      const p = seatPos(t, wi);
      const tx = (p.x - 50).toFixed(2), ty = ((p.y - potY()) * tableH() / 100).toFixed(2);
      for (let j = 0; j < 6; j++) {
        const delay = animDelay(w.t0, n * 250 + j * 70, 800);
        if (delay !== null) html.push(`<span class="chip flychip" style="left:${50 + (j % 3 - 1) * 1.2}%;top:${potY()}%;--tx:${tx}cqw;--ty:${ty}cqw;animation-delay:${delay}ms"></span>`);
      }
    });
  }
  const statusEnter = res && w && fresh(w.t0, 600);
  html.push(`<div class="status statusline${statusEnter ? " enter" : ""}">${status}</div>
  <div class="center">
    <div class="pot${fresh(S.fx.pot, 500) ? " bump" : ""}" ${isActive(t) && pot ? "" : 'style="visibility:hidden"'}><span class="chip"></span><span class="num">${fmt(pot)}</span></div>
    <div class="board">${board}</div>
  </div>`);
  $("#felt").innerHTML = html.join("");
  $("#felt").querySelectorAll("[data-sit]").forEach((b) => b.addEventListener("click", () => {
    if (!S.name) { S.askName = true; renderNameOverlay(); return; }
    send({ t: "sit", seat: +b.dataset.sit });
  }));
  tick();
}

/* ------------------------------------------------------------------ bottom bar: actions and pre-actions */
function renderBar() {
  const t = S.table; const el = $("#bar"); if (!t || !el) return;
  const i = mySeatIdx(t);
  const s = i >= 0 ? t.seats[i] : null;
  const L = s && isActive(t) ? E.legal(t, i) : null;
  const sent = S.sentKey === turnKey(t);
  // The bar has three parts that redraw independently, each only when its own content changes,
  // so a press on an action button is never lost to a redraw of the hand label.
  if (!$("#barRight")) {
    el.innerHTML = `<div id="barPanel"></div><div class="left" id="barLeft"></div><div class="right" id="barRight"></div>`;
    S.barL = S.barR = S.barP = null;
  }
  // left: chat, hand rankings, hand label
  const label = "";
  const left = `<button class="iconbtn" id="chatBtn" aria-label="Chat">${ICON.chat}${S.unread ? `<span class="badge-n">${S.unread}</span>` : ""}</button>
    <button class="iconbtn" id="handsBtn" aria-label="Hand rankings">${ICON.cards}</button>${label}`;
  if (left !== S.barL) {
    const hadLabel = S.barLabel;
    S.barL = left; S.barLabel = label;
    $("#barLeft").innerHTML = left;
    $("#chatBtn").addEventListener("click", () => openDrawer("chat"));
    $("#handsBtn").addEventListener("click", () => openDrawer("hands"));
    const hl = $("#barLeft .hl"); if (hl && label !== hadLabel) hl.classList.add("enter");
  }
  // right: actions; panel: raise amount
  let right = "", panelSig = "", panel = "";
  if (L && !sent) {
    const pot = potTotal(t);
    const clamp = (x) => Math.max(L.minTo, Math.min(L.maxTo, Math.round(x)));
    const half = clamp(t.currentBet + (pot + L.toCall) / 2);
    const full = clamp(t.currentBet + pot + L.toCall);
    const canRaise = L.canRaise && L.maxTo > L.toCall + s.bet;
    if (!S.raiseTo || S.raiseTo < L.minTo || S.raiseTo > L.maxTo) S.raiseTo = L.minTo;
    right = `<span class="clock num" id="myClock"></span>
      <button class="pbtn fold" data-act="fold">Fold</button>
      ${L.canCheck ? `<button class="pbtn" data-act="check">Check</button>` : `<button class="pbtn" data-act="call">${L.toCall >= s.stack ? "All-in" : "Call"} <small class="num">${fmt(L.toCall)}</small></button>`}
      ${canRaise ? `<button class="pbtn go" id="raiseToggle">${L.isBet ? "Bet" : "Raise"}</button>` : ""}`;
    if (canRaise && S.raiseOpen) {
      panelSig = [L.minTo, L.maxTo, half, full, L.isBet].join("/");
      panel = `<div class="raisepanel">
        <div class="presets">
          <button class="btn sm" data-preset="${L.minTo}">Min</button>
          <button class="btn sm" data-preset="${half}">½ Pot</button>
          <button class="btn sm" data-preset="${full}">Pot</button>
          <button class="btn sm" data-preset="${L.maxTo}">All-in</button>
        </div>
        <div class="slide">
          <input type="range" id="raiseRange" min="${L.minTo}" max="${L.maxTo}" step="1" value="${S.raiseTo}" aria-label="Raise amount">
          <input class="input amt num" id="raiseAmt" type="number" min="${L.minTo}" max="${L.maxTo}" value="${S.raiseTo}" aria-label="Raise to">
        </div>
        <button class="pbtn go" data-act="raise" style="width:100%">${L.isBet ? "Bet" : "Raise to"} <span class="num" id="raiseLbl">${fmt(S.raiseTo)}</span></button>
      </div>`;
    }
  } else if (s && s.inHand && !s.folded && !s.allIn && isActive(t) && !sent) {
    const pre = S.pre && S.pre.type;
    const toCall = Math.max(0, t.currentBet - s.bet);
    right = `<button class="pbtn ${pre === "checkfold" ? "armed" : ""}" data-pre="checkfold"><span class="dot"></span>${toCall ? "Fold" : "Check/Fold"}</button>
      ${toCall ? "" : `<button class="pbtn ${pre === "check" ? "armed" : ""}" data-pre="check"><span class="dot"></span>Check</button>`}
      <button class="pbtn ${pre === "callany" ? "armed" : ""}" data-pre="callany"><span class="dot"></span>Call Any</button>`;
  } else if (t.phase === "done" && t.result && !t.result.showdown && !t.result.voided && s && !s.showedOff && t.myHole
    && t.result.winners.some((w) => w.seat === i)) {
    right = `<span class="msg">Everyone folded.</span><button class="pbtn go" data-req="show">Show cards</button>`;
  } else if (holding(t)) {
    right = `<span class="msg">${shownBoard(t).length === t.board.length ? "Showdown…" : "Running it out…"}</span>`;
  } else {
    const ctrl = [];
    const isHost = t.hostUid === S.me;
    let msg = "";
    if (sent) msg = "Sending…";
    const tour = t.tour;
    const over = tour && tour.finished;
    if (isHost && !t.running && !over) ctrl.push(`<button class="pbtn go" data-host="start">${tour && tour.started ? "Resume" : "Start game"}</button>`);
    if (isHost && over) ctrl.push(`<button class="pbtn go" data-host="newtour">New tournament</button>`);
    if (s && s.out) {
      msg = over ? "" : `You finished ${ordinal(s.place || 0)}. Watching the rest.`;
    } else if (s) {
      if (!t.running && !isHost && !over) msg = "Waiting for the host to start";
      if (s.stack === 0 && !(isActive(t) && s.inHand) && !tour) {
        const left = (t.maxBuyins || 2) - (t.myBuyins || 1);
        if (left > 0) ctrl.push(`<button class="pbtn go" data-req="rebuy">Buy in again (${left} left)</button>`);
        else msg = "You've used both buy-ins. You can watch or leave your seat.";
      }
      if (s.stack > 0) ctrl.push(s.sitOut ? `<button class="pbtn" data-req="sitin">Sit back in</button>` : `<button class="pbtn" data-req="sitout">Sit out</button>`);
    } else if (tour && tour.started) {
      msg = "Tournament in progress. You're watching.";
    } else if (!tour && (t.myBuyins || 0) >= (t.maxBuyins || 2)) {
      msg = "You've used both buy-ins at this table. You're watching.";
    } else {
      ctrl.push(`<button class="pbtn go" data-req="sit">Take a seat</button>`);
    }
    right = `${msg ? `<span class="msg">${msg}</span>` : ""}${ctrl.join("")}`;
  }
  const rightSig = right + "|" + t.handNo + ":" + t.phase;
  if (rightSig !== S.barR) {
    S.barR = rightSig;
    const box = $("#barRight");
    box.innerHTML = right;
    box.classList.toggle("enter", !!(L && !sent && fresh(S.fx.turn, 500)));
    box.querySelectorAll("[data-req]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.req === "sit" && !S.name) { S.askName = true; renderNameOverlay(); return; }
      send({ t: b.dataset.req });
    }));
    box.querySelectorAll("[data-host]").forEach((b) => b.addEventListener("click", () => hostCmd(b.dataset.host)));
    box.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => doAct(b.dataset.act)));
    box.querySelectorAll("[data-pre]").forEach((b) => b.addEventListener("click", () => {
      const type = b.dataset.pre;
      S.pre = S.pre && S.pre.type === type ? null : { type, key: S.table.handNo + ":" + S.table.phase, bet: S.table.currentBet };
      renderBar();
    }));
    const rt = $("#raiseToggle"); if (rt) rt.addEventListener("click", () => { S.raiseOpen = !S.raiseOpen; S.fx.raiseAt = Date.now(); renderBar(); });
  }
  if (panelSig !== S.barP) {
    S.barP = panelSig;
    const pb = $("#barPanel");
    pb.innerHTML = panel;
    const rp = pb.querySelector(".raisepanel");
    if (rp) {
      if (fresh(S.fx.raiseAt, 260)) rp.classList.add("enter");
      const rr = $("#raiseRange"), ra = $("#raiseAmt");
      const setR = (v) => {
        const Lc = E.legal(S.table, mySeatIdx());
        if (!Lc) return;
        v = Math.max(Lc.minTo, Math.min(Lc.maxTo, Math.round(+v || 0)));
        S.raiseTo = v; rr.value = v; ra.value = v; $("#raiseLbl").textContent = fmt(v) + (v === Lc.maxTo ? " (all-in)" : "");
      };
      rr.addEventListener("input", () => setR(rr.value));
      ra.addEventListener("change", () => setR(ra.value));
      ra.addEventListener("keydown", (e) => { if (e.key === "Enter") { setR(ra.value); doAct("raise"); } });
      pb.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => setR(b.dataset.preset)));
      pb.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => doAct(b.dataset.act)));
    }
  }
  tick();
}
// host buttons; starting with fewer than 2 players shows a clear warning instead of doing nothing
function hostCmd(cmd, extra) {
  const t = S.table; if (!t) return;
  if (cmd === "start") {
    const ready = t.seats.filter((x) => x && !x.out && !x.leaving && !x.sitOut && x.stack > 0).length;
    if (ready < 2) return warnBox("Not enough players", "You need at least 2 players seated to start. Send your friends the invite link, then press Start once they've sat down.", true);
  }
  send(Object.assign({ t: "host", cmd }, extra || {}));
}
function warnBox(title, msg, withInvite) {

    <div class="row">${withInvite ? `<button class="btn gold" id="warnInvite">Get invite link</button>` : ""}<button class="btn" id="warnOk">OK</button></div></div></div>`;

  const wi = $("#warnInvite"); if (wi) wi.addEventListener("click", () => { el.innerHTML = ""; showInvite(); });

}
function inviteLink() { return location.origin + location.pathname + "#t-" + S.code; }

    e.target.textContent = ok ? "Copied ✓" : "Select and copy";
    if (ok) e.target.classList.add("copied");
  });
  $("#invClose").addEventListener("click", () => { el.innerHTML = ""; });
  $("#invOv").addEventListener("click", (e) => { if (e.target.id === "invOv") el.innerHTML = ""; });
}
function doAct(type) {
  const t = S.table; const i = mySeatIdx(t);
  const L = E.legal(t, i); if (!L) return;
  if (S.sentKey === turnKey(t)) return;
  if (type === "call" && L.canCheck) type = "check";
  const msg = { t: "act", hand: t.handNo, type };
  if (type === "raise") msg.to = S.raiseTo || L.minTo;
  if (!send(msg)) return toast("Reconnecting. Try again in a moment.");
  S.sentKey = turnKey(t); S.raiseOpen = false; S.raiseTo = 0; S.pre = null;
  renderBar();
}
// pre-selected moves (Check/Fold, Check, Call Any) fire as soon as it's your turn
function firePreAction(t) {
  if (!S.pre || !isActive(t) || mySeatIdx(t) !== t.toAct || S.sentKey === turnKey(t)) return;
  const L = E.legal(t, t.toAct); if (!L) return;
  const type = S.pre.type;
  S.pre = null;
  let act = null;
  if (type === "checkfold") act = L.canCheck ? "check" : "fold";
  else if (type === "check") act = L.canCheck ? "check" : null;
  else if (type === "callany") act = L.canCheck ? "check" : "call";
  if (act) setTimeout(() => { if (S.table && mySeatIdx(S.table) === S.table.toAct) doAct(act); }, 350);
  else renderBar();
}
function onKey(e) {
  if (e.key === "Escape" && S.drawer) return closeDrawer();
  if (S.screen !== "table" || e.target.closest("input, textarea, select")) return;
  const t = S.table; if (!t || mySeatIdx(t) !== t.toAct) return;
  const L = E.legal(t, t.toAct); if (!L) return;
  const k = e.key.toLowerCase();
  if (k === "f") doAct("fold");
  else if (k === "c" || k === "k") doAct(L.canCheck ? "check" : "call");
  else if (k === "r" && $("#raiseToggle")) { e.preventDefault(); if (!S.raiseOpen) { S.raiseOpen = true; renderBar(); } const a = $("#raiseAmt"); if (a) { a.focus(); a.select(); } }
}

/* ------------------------------------------------------------------ drawer: chat, log, hands, host */
function renderSide() {
  const dr = $("#drawer"); if (!dr) return;
  dr.classList.toggle("open", S.drawer);
  const hasScrim = !!$("#scrim .scrim");
  if (S.drawer !== hasScrim) {
    $("#scrim").innerHTML = S.drawer ? `<div class="scrim"></div>` : "";
    const sc = $("#scrim .scrim"); if (sc) sc.addEventListener("click", closeDrawer);
  }
  if (!S.drawer) return;
  const t = S.table;
  const isHost = t && t.hostUid === S.me;
  const i = mySeatIdx(t);
  $("#dTitle").textContent = t ? t.name : "Table";
  const da = $("#dActions");
  const dkey = "d" + i + S.name + (t && t.seats[i] && t.seats[i].leaving);
  if (da.dataset.k !== dkey) {
    da.dataset.k = dkey;
    da.innerHTML = `<button class="btn sm" id="renameBtn">Change name</button>${i >= 0 ? `<button class="btn sm" id="leaveBtn">Leave seat</button>` : ""}<button class="btn sm" id="lobbyBtn">Lobby</button><button class="btn sm ghost" id="closeDr" aria-label="Close">✕</button>`;
    $("#renameBtn").addEventListener("click", () => { closeDrawer(); S.askName = true; renderNameOverlay(); });
    const lb = $("#leaveBtn"); if (lb) lb.addEventListener("click", () => { send({ t: "leave" }); closeDrawer(); });
    $("#lobbyBtn").addEventListener("click", () => { location.hash = ""; });
    $("#closeDr").addEventListener("click", closeDrawer);
  }
  const tabs = $("#tabs"); const pane = $("#sidePane");
  const list = [["chat", "Chat"], ["hands", "Hands"]];
  if (isHost) list.push(["host", "Host"]);
  if (!list.find((x) => x[0] === S.tab)) S.tab = "chat";
  tabs.innerHTML = list.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${l}${k === "chat" && S.unread ? `<span class="dot">${S.unread}</span>` : ""}</button>`).join("");
  tabs.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; S.fx.tabAt = Date.now(); if (S.tab === "chat") { S.unread = 0; renderBar(); } S.sideKey = ""; renderSide(); }));
  const paneCls = fresh(S.fx.tabAt, 300) ? "pane enter" : "pane";
  if (S.tab === "hands") {
    const mi = t ? mySeatIdx(t) : -1;
    const d = mi >= 0 && t.myHole && t.seats[mi].inHand ? E.describe(t.myHole, shownBoard(t)) : null;
    const k = "hands" + (d ? d.rank : -1);
    if (S.sideKey === k) return; S.sideKey = k;
    pane.innerHTML = `<div class="${paneCls}"><div class="muted" style="font-size:13px;margin-bottom:6px">Best to worst. Your current hand is highlighted.</div><div class="ranks">${LADDER.slice().reverse().map((n, j) => {
      const r = 8 - j;
      return `<div class="${d && d.rank === r ? "cur" : ""}"><span class="n">${j + 1}</span><span>${n}</span><span class="ex">${LADDER_EX[r]}</span></div>`;
    }).join("")}</div></div>`;
  } else if (S.tab === "chat") {
    const k = "chat" + S.chat.length;
    if (S.sideKey === k) return; S.sideKey = k;
    const had = $("#chatIn") ? $("#chatIn").value : "";
    pane.innerHTML = `<div class="chatwrap"><div class="${paneCls}" id="chatList">${S.chat.map((m, j) => `<div class="chatmsg${j === S.chat.length - 1 && fresh(S.fx.chatAt, 500) ? " new" : ""}"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`).join("") || `<div class="muted">Say hi. Chat isn't saved, so only people at the table now will see it.</div>`}</div>
      <form class="chatform" id="chatForm"><input class="input" id="chatIn" maxlength="240" placeholder="Message the table" autocomplete="off" aria-label="Chat message"><button class="btn sm gold" type="submit">Send</button></form></div>`;
    const cl = $("#chatList"); cl.scrollTop = cl.scrollHeight;
    const ci = $("#chatIn"); ci.value = had;
    $("#chatForm").addEventListener("submit", (e) => { e.preventDefault(); const v = ci.value.trim(); if (v) send({ t: "chat", text: v }); ci.value = ""; ci.focus(); });
  } else if (S.tab === "host" && t) {
    const st = t.settings;
    const tour = t.tour;
    const k = "host" + JSON.stringify([st, t.running, tour, t.seats.map((x) => x && [x.name, x.stack, x.buyins, x.out, x.place])]);
    if (S.sideKey === k) return; S.sideKey = k;
    const opt = (vals, cur, lab = (v) => v) => vals.map((v) => `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${lab(v)}</option>`).join("");
    const ctl = tour && tour.finished ? `<button class="btn gold" data-h="newtour">New tournament</button>`
      : t.running ? `<button class="btn" data-h="pause">Pause after this hand</button>` : `<button class="btn gold" data-h="start">${tour && tour.started ? "Resume" : "Start game"}</button>`;
    const players = t.seats.map((x, j) => x ? { x, j } : null).filter(Boolean)
      .sort((a, b) => (tour ? ((a.x.out ? a.x.place : 0) - (b.x.out ? b.x.place : 0)) : 0) || b.x.stack - a.x.stack);
    pane.innerHTML = `<div class="pane hostpane">
      <div class="row">${ctl}</div>
      ${tour ? `<div class="note">Tournament · starting chips ${fmt(st.stack)} · blinds start at ${fmt(st.baseSb)}/${fmt(st.baseBb)} and double every ${st.levelMins} minutes. Pausing also pauses the blind clock.</div>
        <div class="field"><label for="hLevel">Blinds double every</label><select class="input" id="hLevel">${opt([3, 5, 8, 10], st.levelMins, (v) => v + " minutes")}</select></div>`
      : `<div class="field"><label for="hStake">Stakes (from next hand; new buy-ins get this many chips)</label><select class="input" id="hStake">${STAKE_OPTS.map(([v, l]) => `<option value="${v}" ${v === st.stake ? "selected" : ""}>${l}</option>`).join("")}</select></div>`}
      <div class="field"><label for="hTimer">Time per turn</label><select class="input" id="hTimer">${opt([0, 30, 45, 90], st.turnSecs, (v) => (v ? v + " seconds" : "No limit"))}</select></div>
      <div class="field"><label>Players</label><div class="plist">${players.map(({ x, j }) => `<div><span>${esc(x.name)} <span class="muted num">${x.out ? `out · ${ordinal(x.place || 0)}` : fmt(x.stack)}${!tour ? ` · buy-ins ${x.buyins || 1}/${t.maxBuyins || 2}` : ""}</span></span>${x.uid === S.me ? "" : `<button class="btn sm ghost" data-kick="${j}">Remove</button>`}</div>`).join("")}</div></div>
      <button class="btn sm" id="closeBtn" style="background:#5a1d18">Close table</button>
    </div>`;
    pane.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => hostCmd(b.dataset.h)));
    const hl = $("#hLevel"); if (hl) hl.addEventListener("change", (e) => hostCmd("level", { value: +e.target.value }));
    const hs = $("#hStake"); if (hs) hs.addEventListener("change", (e) => hostCmd("stake", { value: e.target.value }));
    $("#hTimer").addEventListener("change", (e) => hostCmd("timer", { value: +e.target.value }));
    pane.querySelectorAll("[data-kick]").forEach((b) => b.addEventListener("click", () => hostCmd("kick", { seat: +b.dataset.kick })));
    $("#closeBtn").addEventListener("click", (e) => {
      if (e.target.dataset.armed !== "1") { e.target.dataset.armed = "1"; e.target.textContent = "Click again to close for everyone"; return; }
      hostCmd("close");
    });
  }
}

function tourClockText(t) {
  if (!t.tour || !t.tourClock) return "";
  if (t.tour.finished) return "Tournament over";
  if (!t.tour.started) return `Blinds double every ${t.settings.levelMins} min`;
  const c = t.tourClock;
  const left = c.ticking ? c.msLeft - (Date.now() + S.clockSkew - t.serverNow) : c.msLeft;
  if (left <= 0) return `Next hand: blinds ${fmt(c.nextSb)}/${fmt(c.nextBb)}`;
  return `${c.ticking ? "" : "Paused · "}Blinds ${fmt(c.nextSb)}/${fmt(c.nextBb)} in ${mmss(left)}`;
}
function tick() {
  const t = S.table;
  const cl = $("#clock"); if (cl && t) cl.textContent = tourClockText(t);
  if (S.screen !== "table" || !t || !isActive(t) || t.toAct < 0 || !t.settings.turnSecs) return;
  const left = Math.max(0, t.turnStarted + t.settings.turnSecs * 1000 - (Date.now() + S.clockSkew));
  const frac = left / (t.settings.turnSecs * 1000);
  const seat = $(`.seat[data-seat="${t.toAct}"]`);
  if (seat) { seat.querySelector(".av").style.setProperty("--t", frac.toFixed(3)); seat.classList.toggle("low", left < 10000); }
  const clk = $("#myClock"); if (clk) clk.textContent = Math.ceil(left / 1000) + "s";
}

// Android can switch to full-screen landscape from a button; iPhones can't, so they just get the prompt.
const canLock = !!(document.documentElement.requestFullscreen && screen.orientation && screen.orientation.lock);
async function goLandscape() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    await screen.orientation.lock("landscape");
  } catch (e) { toast("Turn your phone sideways. If it doesn't turn, switch off rotation lock."); }
}
(() => {
  const gl = $("#goLandscape"); if (canLock) gl.classList.remove("hidden");
  gl.addEventListener("click", goLandscape);
  $("#stayUpright").addEventListener("click", () => { document.body.classList.add("allow-portrait"); renderFelt(); });
})();
window.addEventListener("hashchange", route);
setInterval(tick, 250);
// a soft ripple wherever a button is pressed
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".btn, .pbtn, .sitbtn");
  if (!b || b.disabled || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2.2;
  const sp = document.createElement("span");
  sp.className = "ripple";
  sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;
  b.appendChild(sp);
  setTimeout(() => sp.remove(), 650);
});
// While anyone has the site open, a tiny message every 4 minutes keeps free hosting from going to sleep mid-game.
setInterval(() => send({ t: "ping" }), 4 * 60 * 1000);
connect();
})();
</script>
